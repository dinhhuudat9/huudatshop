services:
  # === BACKEND (API Server) ===
  - type: web
    name: mmo-store-api
    runtime: node
    rootDir: .
    buildCommand: "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/db run build && pnpm --filter @workspace/api-zod run build && pnpm --filter @workspace/api-server run build"
    startCommand: "pnpm --filter @workspace/api-server run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mmo-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # === FRONTEND (React + Vite) ===
  - type: web
    name: mmo-store-frontend
    runtime: static
    rootDir: artifacts/mmo-store
    buildCommand: "npm install -g pnpm && cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @workspace/mmo-store run build"
    staticPublishPath: dist/public
    envVars:
      - key: PORT
        value: 3000
      - key: BASE_PATH
        value: /
      - key: VITE_API_URL
        fromService:
          name: mmo-store-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: mmo-store-db
    databaseName: mmo_store
    user: mmo_store_user
    plan: free
